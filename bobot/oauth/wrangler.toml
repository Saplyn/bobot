#:schema ../../node_modules/wrangler/config-schema.json

name = "bobot-oauth"
main = "build/index.js"
compatibility_date = "2026-05-02"
workers_dev = false
preview_urls = false

[build]
command = "cargo install worker-build && worker-build --profile=wasm-release --panic-unwind"

[[routes]]
zone_name = "saplyn.site"
pattern = "oauth.bobo.saplyn.site"
custom_domain = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1.00

[observability.traces]
enabled = true
head_sampling_rate = 1.00

[[secrets_store_secrets]]
binding = "QQ_OAUTH_ID"
store_id = "7afbc0c2179847f893ba21721f5d8df4"
secret_name = "QQ_OAUTH_ID"

[[secrets_store_secrets]]
binding = "QQ_OAUTH_SECRET"
store_id = "7afbc0c2179847f893ba21721f5d8df4"
secret_name = "QQ_OAUTH_SECRET"

[[secrets_store_secrets]]
binding = "LYN_KEY_SUPABASE_SHA256"
store_id = "7afbc0c2179847f893ba21721f5d8df4"
secret_name = "LYN_KEY_SUPABASE_SHA256"

[[d1_databases]]
binding = "BOBOT_STATEFUL"
database_name = "bobot-stateful"
database_id = "39a165b6-ca4d-4837-81ef-e312a4d05b4c"
migrations_dir = "../stateful/"
